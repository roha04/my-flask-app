name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Ruff
        run: ruff check app tests alembic

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=75

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

      - name: Publish coverage summary
        run: |
          echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          line_rate = float(root.get("line-rate", 0)) * 100
          print(f"- Line coverage: **{line_rate:.1f}%**")
          PY

  semver:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate SemVer tag matches app version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(python -c "from app.version import __version__; print(__version__)")
          echo "Git tag: $TAG"
          echo "App version: $VERSION"
          if [ "v${VERSION}" != "$TAG" ]; then
            echo "Tag v${VERSION} expected, got ${TAG}"
            exit 1
          fi
          echo "## Release $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Application version **$VERSION** matches tag." >> "$GITHUB_STEP_SUMMARY"
