{% extends "base.html" %}
{% block title %}New application — Job Hunt CRM{% endblock %}
{% block content %}
<h1 class="h3 mb-3">New application</h1>
<div class="card shadow-sm">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Job</label>
        <select class="form-select" name="job_id" required>
          {% for job in jobs %}
          <option value="{{ job.id }}" {% if selected_job_id == job.id %}selected{% endif %}>{{ job.title }} — {{ job.company.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Resume</label>
        <select class="form-select" name="resume_version_id">
          <option value="">— None —</option>
          {% for resume in resumes %}
          <option value="{{ resume.id }}">{{ resume.title }}{% if resume.is_active %} (active){% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Initial stage</label>
        <select class="form-select" name="stage">
          {% for stage in stages %}
          <option value="{{ stage.value }}">{{ stage.value }}</option>
          {% endfor %}
        </select>
      </div>
      <button class="btn btn-primary" type="submit">Create</button>
      <a class="btn btn-link" href="/applications">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
