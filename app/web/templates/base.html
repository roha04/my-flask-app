<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Job Hunt CRM{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .kanban-column { min-height: 320px; }
    .kanban-card { cursor: pointer; }
    .score-badge { font-size: 0.75rem; }
  </style>
</head>
<body class="bg-light">
{% if user %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Job Hunt CRM</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/">Dashboard</a>
      <a class="nav-link" href="/companies">Companies</a>
      <a class="nav-link" href="/jobs">Jobs</a>
      <a class="nav-link" href="/applications">Applications</a>
      <a class="nav-link" href="/resumes">Resumes</a>
      <a class="nav-link" href="/docs" target="_blank">API Docs</a>
    </div>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="text-white-50 small">{{ user.name }}</span>
      <form method="post" action="/logout">
        <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
      </form>
    </div>
  </div>
</nav>
{% endif %}

<div class="container pb-5">
  {% if message %}
  <div class="alert alert-success">{{ message }}</div>
  {% endif %}
  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
