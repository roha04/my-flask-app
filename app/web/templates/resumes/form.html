{% extends "base.html" %}
{% block title %}{{ title }} — Job Hunt CRM{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ title }}</h1>
<div class="card shadow-sm">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input class="form-control" name="title" value="{{ resume.title if resume else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Content</label>
        <textarea class="form-control" name="content" rows="12" required>{{ resume.content if resume else '' }}</textarea>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="is_active" value="1" id="is_active"
          {% if resume and resume.is_active %}checked{% endif %}>
        <label class="form-check-label" for="is_active">Set as active resume</label>
      </div>
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-link" href="/resumes">Cancel</a>
    </form>
    {% if resume %}
    <form method="post" action="/resumes/{{ resume.id }}/delete" class="mt-3" onsubmit="return confirm('Delete this resume?')">
      <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
    </form>
    {% endif %}
  </div>
</div>
{% endblock %}
