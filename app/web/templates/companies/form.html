{% extends "base.html" %}
{% block title %}{{ title }} — Job Hunt CRM{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ title }}</h1>
<div class="card shadow-sm">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input class="form-control" name="name" value="{{ company.name if company else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Industry</label>
        <input class="form-control" name="industry" value="{{ company.industry if company and company.industry else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Size</label>
        <input class="form-control" name="size" value="{{ company.size if company and company.size else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Website</label>
        <input class="form-control" name="website" value="{{ company.website if company and company.website else '' }}">
      </div>
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-link" href="/companies">Cancel</a>
    </form>
    {% if company %}
    <form method="post" action="/companies/{{ company.id }}/delete" class="mt-3" onsubmit="return confirm('Delete this company?')">
      <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
    </form>
    {% endif %}
  </div>
</div>
{% endblock %}
